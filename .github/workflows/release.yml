name: Release

# Triggers only when a version tag is pushed (e.g. v1.2.0)
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: windows-latest  # Required: net48 + WinForms needs Windows

    # Allow the workflow to create releases via GITHUB_TOKEN
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'   # SDK only needed for MSBuild; net48 TFM is pre-installed on windows-latest

      - name: Download CommsRadioAPI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "lib" -Force | Out-Null
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/fauxnik/dv-comms-radio-api/releases/latest" `
            -Headers @{ "User-Agent" = "GRDNConnect-CI" }
          # Try a bare .dll asset first, fall back to zip extraction
          $dll = $release.assets | Where-Object { $_.name -like "*CommsRadioAPI*.dll" } | Select-Object -First 1
          if ($dll) {
            Invoke-WebRequest -Uri $dll.browser_download_url -OutFile "lib\CommsRadioAPI.dll"
            Write-Host "Downloaded $($dll.name)"
          } else {
            $zip = $release.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1
            if (-not $zip) { Write-Error "No CommsRadioAPI asset found in release"; exit 1 }
            Invoke-WebRequest -Uri $zip.browser_download_url -OutFile "CommsRadioAPI.zip"
            Expand-Archive -Path "CommsRadioAPI.zip" -DestinationPath "CommsRadioAPI_extracted" -Force
            $found = Get-ChildItem -Path "CommsRadioAPI_extracted" -Filter "CommsRadioAPI.dll" -Recurse |
                     Select-Object -First 1
            if (-not $found) { Write-Error "CommsRadioAPI.dll not found inside zip"; exit 1 }
            Copy-Item $found.FullName "lib\CommsRadioAPI.dll"
            Write-Host "Extracted CommsRadioAPI.dll from $($zip.name)"
          }
          Write-Host "lib\CommsRadioAPI.dll is ready — COMMS_RADIO_API will be defined"

      - name: Stamp Info.json (version + update channel)
        shell: pwsh
        run: |
          # v1.2.3 -> 1.2.3. A hyphen in the tag (v0.93.0-beta.1) means beta channel.
          $tag     = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $manifest = if ($tag.Contains('-')) { 'repository-beta.json' } else { 'repository.json' }
          $pointer  = "https://raw.githubusercontent.com/${{ github.repository }}/main/$manifest"
          $text = Get-Content Info.json -Raw
          # Regex, not ConvertFrom-Json: keeps formatting and special characters intact
          $text = $text -replace '"Version"\s*:\s*"[^"]*"',    ('"Version": "' + $version + '"')
          $text = $text -replace '"Repository"\s*:\s*"[^"]*"', ('"Repository": "' + $pointer + '"')
          Set-Content Info.json $text -Encoding utf8NoBOM
          Write-Host "Version $version, update channel $manifest"

      - name: Restore NuGet packages
        run: dotnet restore GRDNConnect.csproj

      - name: Build (Release)
        run: dotnet build GRDNConnect.csproj -c Release --no-restore

      - name: Package
        run: |
          New-Item -ItemType Directory -Path "release\GRDNConnect" -Force | Out-Null
          $dll = Get-ChildItem -Path "bin\Release" -Filter "GRDNConnect.dll" -Recurse | Select-Object -First 1
          Copy-Item $dll.FullName "release\GRDNConnect\"
          Copy-Item "Info.json" "release\GRDNConnect\"
          Compress-Archive -Path "release\GRDNConnect" -DestinationPath "GRDNConnect-${{ github.ref_name }}.zip"

      - name: Generate repository.json (UMM/DVMM update manifest)
        shell: pwsh
        run: |
          # Still attached to every release: installs older than this change read
          # releases/latest/download/repository.json and follow stable through it.
          # New installs read the copy committed on main (see last step).
          $tag     = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $zipUrl  = "https://github.com/${{ github.repository }}/releases/download/$tag/GRDNConnect-$tag.zip"
          $manifest = [ordered]@{
            Releases = @(
              [ordered]@{
                Id          = "GRDNConnect"
                Version     = $version
                DownloadUrl = $zipUrl
              }
            )
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content repository.json -Encoding utf8NoBOM
          Write-Host "repository.json:"; Get-Content repository.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "GRDNConnect ${{ github.ref_name }}"
          files: |
            GRDNConnect-${{ github.ref_name }}.zip
            repository.json
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Anything with a hyphen (v0.93.0-beta.1) publishes as a prerelease, so
          # GitHub's releases/latest keeps pointing at stable for older installs.
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Commit update manifests to main
        shell: pwsh
        run: |
          # Update pointers live on main, not in release assets. A release asset is
          # frozen when it ships, so it can never advertise a newer version.
          # Beta tag: rewrite repository-beta.json only.
          # Stable tag: rewrite both, so beta players move onto the stable too.
          $tag  = "${{ github.ref_name }}"
          $json = Get-Content repository.json -Raw
          git fetch origin main
          # -f: drop the stamped Info.json and generated manifest, both already shipped
          git checkout -f -B main origin/main
          Set-Content repository-beta.json $json -Encoding utf8NoBOM
          if (-not $tag.Contains('-')) { Set-Content repository.json $json -Encoding utf8NoBOM }
          $changed = git status --porcelain -- repository.json repository-beta.json
          if (-not $changed) { Write-Host "Manifests already current"; exit 0 }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repository.json repository-beta.json
          git commit -m "Point update manifests at $tag"
          git push origin main
